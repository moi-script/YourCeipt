<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="icon" type="image/png" href="/favicon.png">
    <title>Recepta: receipts in, clean ledger out</title>
    <meta name="description" content="Photograph a receipt and Recepta reads the store, items and total into your expense ledger. Free for personal use." />
    <meta name="theme-color" content="#f7f6f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      /* Android app only: a splash from the first paint until React takes over,
         instead of a blank screen while the scripts download. */
      .boot { display: none; }
      html.native-app .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f6f2; }
      html.native-app.dark .boot { background: #0c0a09; }
      .boot span { display: grid; place-items: center; width: 80px; height: 80px; border-radius: 22px; background: #065f46; color: #f7f6f2; font: 48px/1 "Instrument Serif", Georgia, serif; }
    </style>
    <script>
      // Capacitor's bridge object exists before any page script runs.
      if (window.androidBridge) document.documentElement.classList.add("native-app");
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><span>R</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    // Immediately checks local storage and applies the class before React loads
    (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // If saved is 'dark', OR if no save exists but system is dark
        if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();

  </script>
  </body>
</html>
